name: CI - RecipeBook

on:
  push:
    branches:
      - develop
      - 'feature/**'
      - 'hotfix/**'

  pull_request:
    branches:
      - main
      - develop

jobs:

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Backend
        run: cd backend && mvn verify

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: cd frontend && npm install

      - name: Build Angular
        run: cd frontend && npm run build